name: Release

# Triggered only by version tags. A ruleset lets only repository admins create v* tags, and the
# signing key lives in the protected `release` environment, which needs a maintainer's approval
# and only accepts deployments from v* tags.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: usb-forge-windows-x86_64.exe
            binary: target/release/usb-forge.exe
          - os: ubuntu-24.04
            asset: usb-forge-linux-x86_64
            binary: target/release/usb-forge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version"; exit 1
          fi
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked
      - name: Stage
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: mkdir dist && cp "$BINARY" "dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: sign & publish
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Build signer
        run: cargo build --release --locked -p release-sign
      - name: Sign and verify
        env:
          USB_FORGE_SIGNING_KEY: ${{ secrets.USB_FORGE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          public=$(cat keys/release-signing.pub)
          for asset in usb-forge-windows-x86_64.exe usb-forge-linux-x86_64; do
            ./target/release/release-sign sign "dist/$asset" "$version" "$asset"
            # Fails the release if the secret key doesn't match the public key users trust.
            ./target/release/release-sign verify "dist/$asset" "$version" "$asset" "$public"
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "USB Forge $GITHUB_REF_NAME" \
            --generate-notes
