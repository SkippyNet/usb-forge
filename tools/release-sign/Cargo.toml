[package]
name = "release-sign"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Generates the USB Forge release key and signs release binaries"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4.3"
sha2 = "0.11.1"
