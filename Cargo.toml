[workspace]
members = [".", "tools/release-sign"]
resolver = "3"

[package]
name = "usb-forge"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
description = "Build a verified multi-boot USB thumb drive (Ventoy + official ISOs) on Windows and Linux"
license = "MIT"
repository = "https://github.com/SkippyNet/usb-forge"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.35.0"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.1"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["x11", "wayland"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
